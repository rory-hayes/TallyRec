name: ci

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Apply migrations
        run: supabase migration up --db-url "$TEST_DATABASE_URL" --include-all

      - name: Run unit tests
        run: uv run pytest tests/unit -q

      - name: Run DB tests
        run: uv run pytest tests/db -q

      - name: Run integration tests
        run: uv run pytest tests/integration -q

      - name: Run golden harness tests
        run: uv run pytest tests/harness -q

      - name: Run determinism regression
        run: uv run pytest tests/harness/test_determinism.py -q
