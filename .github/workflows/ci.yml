name: ci

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Apply migrations
        run: supabase migration up --db-url "$TEST_DATABASE_URL" --include-all

      - name: Run full test suite with coverage gate
        run: uv run pytest --cov=apps --cov=libs --cov-report=term-missing --cov-fail-under=95 tests/unit tests/db tests/integration tests/harness -q

      - name: Golden regression gate
        run: uv run python scripts/run_golden.py

      - name: Determinism gate
        run: uv run pytest tests/harness/test_determinism.py -q

  web-e2e:
    runs-on: ubuntu-latest
    needs: backend-test
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/v1
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install Python dependencies
        run: uv sync --extra dev

      - name: Apply migrations
        run: supabase migration up --db-url "$TEST_DATABASE_URL" --include-all

      - name: Start API server
        run: |
          uv run uvicorn apps.api.app.main:app --host 127.0.0.1 --port 8000 > /tmp/tally-api.log 2>&1 &
          echo $! > /tmp/tally-api.pid
          for i in {1..40}; do
            if curl -sf http://127.0.0.1:8000/v1/ready > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          cat /tmp/tally-api.log
          exit 1

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report

      - name: Dump API log on failure
        if: failure()
        run: cat /tmp/tally-api.log
